[package]
name = "syn_sale"
version = "0.1.0"
edition = "2021"
description = "Fixed-rate ICP → $SYN sale. Mints via syn_ledger. Admin-set ICP/USD rate."

[lib]
crate-type = ["cdylib"]

[dependencies]
candid = "0.10"
ic-cdk = "0.18"
ic-stable-structures = "0.6"
serde = { version = "1", features = ["derive"] }
